<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso - PIN</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        linear-gradient(135deg, rgba(10,20,40,.75), rgba(20,80,120,.55)),
        url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1920&q=80")
        center/cover no-repeat;

    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

/* Área principal */
.container {
    display: flex;
    align-items: center;
    gap: 70px;
    padding: 30px;
}

/* Painel de login */
.login-box {
    width: 360px;
    padding: 40px;
    background: rgba(255,255,255,.13);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 25px;
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
}

.login-box h1 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 32px;
}

/* Campos */
.input-group {
    margin-bottom: 18px;
}

.input-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.input-group input {
    width: 100%;
    padding: 14px;
    border: 2px solid transparent;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
    background: rgba(255,255,255,.92);
    color: #222;
    transition: .3s;
}

.input-group input:focus {
    border-color: #00bfff;
}

/* Erro */
.input-group input.erro {
    background: #ffe0c2;
    border: 3px solid orange;
}

.esqueci {
    display: block;
    text-align: right;
    color: #fff;
    margin-bottom: 22px;
    font-size: 14px;
    text-decoration: none;
}

.esqueci:hover {
    text-decoration: underline;
}

/* Botões */
.botoes {
    display: flex;
    gap: 10px;
}

button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

.btn-acessar {
    background: #F97316d1;
    color: white;
}

.btn-acessar:hover {
    background: #F97316d1;
    transform: translateY(-2px);
}

.btn-cadastrar {
    background: white;
    color: #F97316;
}

.btn-cadastrar:hover {
    background: #e9f8ff;
    transform: translateY(-2px);
}

/* Logo */
.logo img {
    width: 600px;
    height: auto;
}

.logo span {
    font-size: 75px;
    font-weight: 900;
    letter-spacing: -5px;
    color: white;
}

/* Janela de sucesso */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    align-items: center;
    justify-content: center;
}

.modal.ativo {
    display: flex;
}

.modal-content {
    width: 300px;
    padding: 35px;
    text-align: center;
    background: white;
    color: #222;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    animation: aparecer .3s ease;
}

.modal-content h2 {
    color: #08a045;
    margin-bottom: 12px;
}

.modal-content button {
    margin-top: 20px;
    background: #08a045;
    color: white;
    width: 100%;
}

@keyframes aparecer {
    from {
        transform: scale(.7);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

/* Responsividade */
@media (max-width: 700px) {
    .container {
        flex-direction: column;
        gap: 25px;
    }

    .logo {
        order: -1;
        width: 120px;
        height: 120px;
    }

    .logo span {
        font-size: 40px;
    }

    .login-box {
        width: min(90vw, 360px);
        padding: 30px;
    }
}

@media (max-width: 380px) {
    .botoes {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- Logotipo -->
    <div class="logo">
    <img src="logo.png" alt="Logo do projeto">
</div>

    <!-- Painel -->
    <div class="login-box">
        <h1>Acesso</h1>

        <div class="input-group">
            <label for="usuario">Usuário</label>
            <input
                type="text"
                id="usuario"
                placeholder="Digite seu usuário">
        </div>

        <div class="input-group">
            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha">
        </div>

        <a href="#" class="esqueci" onclick="return false;">
            Esqueci a senha
        </a>

        <div class="botoes">
            <button class="btn-acessar" onclick="validar()">
                Acessar
            </button>

            <button class="btn-cadastrar" onclick="cadastrar()">
                Me Cadastrar
            </button>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h2>Sucesso!</h2>
        <p>Os dados foram preenchidos corretamente.</p>
        <button onclick="fecharModal()">OK</button>
    </div>
</div>

<script>
function validar() {
    const usuario = document.getElementById("usuario");
    const senha = document.getElementById("senha");

    let valido = true;

    usuario.classList.remove("erro");
    senha.classList.remove("erro");

    if (usuario.value.trim() === "") {
        usuario.classList.add("erro");
        usuario.placeholder = "PREENCHER AQUI";
        valido = false;
    }

    if (senha.value.trim() === "") {
        senha.classList.add("erro");
        senha.placeholder = "PREENCHER AQUI";
        valido = false;
    }

    if (valido) {
        document.getElementById("modal").classList.add("ativo");
    }
}

function fecharModal() {
    document.getElementById("modal").classList.remove("ativo");
}

function cadastrar() {
    alertarCadastro();
}

function alertarCadastro() {
    const usuario = document.getElementById("usuario");
    const senha = document.getElementById("senha");

    usuario.focus();

    if (usuario.value.trim() === "" || senha.value.trim() === "") {
        validar();
    } else {
        document.getElementById("modal").classList.add("ativo");
    }
}
</script>

</body>
</html>
